amazon_books_etl_aws:
  target: athena
  outputs:
    athena:
      type: athena
      s3_staging_dir: 's3://amazon-books-etl-aws-915238109570/athena-results/'
      # Iceberg tables need an explicit physical location; without s3_data_dir the adapter
      # derives it as s3_staging_dir + '/tables/', which puts table data under the query-results
      # prefix — a lifecycle expiration rule there would delete the warehouse.
      s3_data_dir: 's3://amazon-books-etl-aws-915238109570/warehouse/'
      # Explicit, not just the adapter default: on --full-refresh dbt-athena picks a
      # rename-based near-zero-downtime path only when this value lacks 'unique'.
      s3_data_naming: 'schema_table_unique'
      region_name: 'eu-central-1'
      database: 'awsdatacatalog'
      schema: 'bronze'
      work_group: 'primary'
      threads: 4

[project]
name = "amazon-books-etl-AWS"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pydantic",
    "PyYAML",
    "python-dotenv",
    "boto3",
]

[project.optional-dependencies]
dbt = ["dbt-core", "dbt-athena-community", "dbt-duckdb"]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
